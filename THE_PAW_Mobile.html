<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE PAW — Mobile Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--dark:#16213D;--mid:#2C3E6E;--accent:#FFD700;--green:#0D6B4A;--red:#A32D2D;--light:#F7F9FF;--white:#FFFFFF;--border:#e0e4f0;--text:#1a1a2e;--muted:#6b7280;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f3fa;color:var(--text);min-height:100vh;padding-bottom:100px}
header{background:var(--dark);color:var(--accent);padding:1rem 1.2rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
header h1{font-size:1rem;font-weight:700;letter-spacing:1px}
#clock{font-size:.75rem;color:rgba(255,215,0,.6);margin-left:auto}
.container{max-width:480px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.card{background:var(--white);border-radius:var(--radius);box-shadow:0 2px 12px rgba(22,33,61,.08);overflow:hidden}
.card-header{background:var(--mid);color:white;padding:.6rem 1rem;font-size:.82rem;font-weight:700}
.card-body{padding:1rem}
.db-status{padding:.7rem 1rem;border-radius:10px;font-size:.85rem;font-weight:600;margin-bottom:8px}
.db-status.ok{background:#eafaf0;color:#0D6B4A;border:2px solid #0D6B4A}
.db-status.loading{background:#e8f0fe;color:#2C3E6E;border:2px solid #2C3E6E}
.db-status.error{background:#fdf3f3;color:#A32D2D;border:2px solid #A32D2D}

/* SCANNER */
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000}
#reader video{width:100%!important;border-radius:12px}
.scan-btn{width:100%;padding:1rem;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:8px;transition:all .2s}
.scan-btn.start{background:var(--dark);color:var(--accent)}
.scan-btn.stop{background:var(--red);color:white}
.manual-row{display:flex;gap:8px;margin-top:8px}
.manual-row input{flex:1;padding:.8rem 1rem;border:2px solid var(--border);border-radius:10px;font-size:1rem}
.manual-row input:focus{outline:none;border-color:var(--mid)}
.manual-row button{padding:.8rem 1rem;background:var(--mid);color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem}

/* RESULT */
.result-box{border-radius:12px;padding:1rem;border:2px solid transparent}
.result-box.found{background:#eafaf0;border-color:#0D6B4A}
.result-box.notfound{background:#fdf3f3;border-color:var(--red)}
.result-box.empty{background:var(--light);border-color:var(--border)}
.result-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.result-name{font-size:.95rem;font-weight:700}
.result-price{font-size:1.5rem;font-weight:800;color:var(--green);margin-top:6px}
.badge{font-size:.75rem;color:var(--muted);background:var(--light);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px;margin-right:4px}

/* CONTROLS */
.qty-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.qty-row label{font-size:.85rem;color:var(--muted);font-weight:600}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:40px;height:40px;border:2px solid var(--border);border-radius:10px;background:white;font-size:1.3rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mid)}
.qty-btn:active{background:var(--mid);color:white}
.qty-val{font-size:1.2rem;font-weight:700;min-width:36px;text-align:center}
.disc-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.disc-row label{font-size:.85rem;color:var(--muted);font-weight:600}
.disc-row input{width:80px;padding:8px 10px;border:2px solid var(--border);border-radius:8px;font-size:1rem;text-align:center}
.add-btn{width:100%;padding:1.1rem;border:none;border-radius:12px;background:var(--green);color:white;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:14px}
.add-btn:active{filter:brightness(.9)}

/* TOTALS */
.totals-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tot-box{background:var(--light);border-radius:10px;padding:.8rem;text-align:center}
.tot-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.tot-val{font-size:1.1rem;font-weight:800;color:var(--dark);margin-top:2px}
.tot-val.green{color:var(--green)}
.tot-val.gold{color:#B8860B}

/* CART */
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:var(--light);color:var(--mid);font-weight:700;padding:7px;text-align:left;font-size:.7rem;text-transform:uppercase}
td{padding:7px;border-bottom:1px solid var(--border);vertical-align:middle}
.del-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:1.1rem;padding:4px 8px}
.empty-state{text-align:center;padding:1.5rem;color:var(--muted);font-size:.9rem}

/* EXPORT */
.export-row{display:flex;gap:8px;flex-wrap:wrap}
.export-btn{flex:1;padding:.8rem;border:2px solid var(--mid);border-radius:10px;background:white;color:var(--mid);font-weight:700;font-size:.82rem;cursor:pointer;text-align:center;min-width:80px}
.export-btn:active{background:var(--mid);color:white}
.export-btn.danger{border-color:var(--red);color:var(--red)}
.export-btn.danger:active{background:var(--red);color:white}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--accent);padding:12px 20px;border-radius:50px;font-weight:700;font-size:.88rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* API URL input */
.api-input{width:100%;padding:.7rem;border:2px solid var(--border);border-radius:10px;font-size:.78rem;font-family:monospace;margin-top:6px;color:var(--muted)}
.api-input:focus{outline:none;border-color:var(--mid)}
.save-btn{width:100%;padding:.7rem;border:none;border-radius:10px;background:var(--mid);color:white;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>
  <span style="font-size:1.4rem">🐾</span>
  <h1>THE PAW — Mobile</h1>
  <span id="clock"></span>
</header>

<div class="container">

  <!-- API CONFIG -->
  <div class="card" id="configCard">
    <div class="card-header">⚙️ Ρύθμιση API</div>
    <div class="card-body">
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:6px">Επικόλλησε το Apps Script URL:</div>
      <input class="api-input" id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"/>
      <button class="save-btn" onclick="saveApiUrl()">💾 Αποθήκευση & Σύνδεση</button>
    </div>
  </div>

  <!-- STATUS -->
  <div class="card">
    <div class="card-header">☁️ Google Sheets</div>
    <div class="card-body">
      <div id="dbStatus" class="db-status loading">⏳ Εισάγαγε το API URL...</div>
      <button onclick="loadProducts()" style="width:100%;padding:.7rem;border:2px solid var(--mid);border-radius:10px;background:white;color:var(--mid);font-weight:700;font-size:.85rem;cursor:pointer;margin-top:6px">🔄 Ανανέωση</button>
    </div>
  </div>

  <!-- SCANNER -->
  <div class="card">
    <div class="card-header">📷 Scanner</div>
    <div class="card-body">
      <div id="reader"></div>
      <button class="scan-btn start" id="scanBtn" onclick="toggleScan()">📷 Ενεργοποίηση Κάμερας</button>
      <div class="manual-row">
        <input type="text" id="manualCode" placeholder="ή πληκτρολόγησε κωδικό..." onkeydown="if(event.key==='Enter')lookupCode()" autocomplete="off"/>
        <button onclick="lookupCode()">🔍</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="card">
    <div class="card-header">🏷️ Προϊόν</div>
    <div class="card-body">
      <div class="result-box empty" id="resultBox">
        <div class="result-label">Αποτέλεσμα</div>
        <div class="result-name" style="color:var(--muted)">Σκάναρε ή πληκτρολόγησε κωδικό...</div>
      </div>
      <div id="addSection" style="display:none">
        <div class="qty-row">
          <label>Ποσότητα:</label>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-val" id="qtyVal">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
        </div>
        <div class="disc-row">
          <label>Έκπτωση %:</label>
          <input type="number" id="discInput" value="0" min="0" max="100" step="5"/>
        </div>
        <button class="add-btn" onclick="addToCart()">✅ Προσθήκη στο Καλάθι</button>
      </div>
    </div>
  </div>

  <!-- TOTALS -->
  <div class="card">
    <div class="card-header">💰 Σύνολα</div>
    <div class="card-body">
      <div class="totals-bar">
        <div class="tot-box"><div class="tot-label">Πωλήσεις</div><div class="tot-val" id="totItems">0</div></div>
        <div class="tot-box"><div class="tot-label">Έσοδα</div><div class="tot-val green" id="totRevenue">0,00€</div></div>
        <div class="tot-box"><div class="tot-label">Κέρδος</div><div class="tot-val gold" id="totProfit">0,00€</div></div>
      </div>
    </div>
  </div>

  <!-- CART -->
  <div class="card">
    <div class="card-header">🛒 Καλάθι</div>
    <div class="card-body" style="padding:0">
      <div id="cartEmpty" class="empty-state">🛍️ Άδειο καλάθι</div>
      <div id="cartTable" style="display:none;overflow-x:auto">
        <table><thead><tr><th>Προϊόν</th><th>Τεμ.</th><th>Σύνολο</th><th></th></tr></thead>
        <tbody id="cartBody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- EXPORT -->
  <div class="card">
    <div class="card-header">📤 Αποθήκευση</div>
    <div class="card-body">
      <div class="export-row">
        <button class="export-btn" onclick="syncToSheets()">☁️ Αποθήκευση</button>
        <button class="export-btn" onclick="printReceipt()">🖨️ Απόδειξη</button>
        <button class="export-btn danger" onclick="clearCart()">🗑️ Καθαρισμός</button>
      </div>
      <div id="syncStatus" style="margin-top:10px;font-size:.82rem;color:var(--muted);text-align:center"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
var API_URL = localStorage.getItem('thepaw_api') || '';
var products={}, cart=[], scanner=null, scanning=false, currentProduct=null, qty=1;

// Clock
setInterval(function(){
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
},1000);

// Init
window.onload = function(){
  if(API_URL){
    document.getElementById('apiUrlInput').value = API_URL;
    document.getElementById('configCard').style.display = 'none';
    loadProducts();
  }
};

function saveApiUrl(){
  var url = document.getElementById('apiUrlInput').value.trim();
  if(!url){showToast('❌ Εισάγαγε το URL');return;}
  API_URL = url;
  localStorage.setItem('thepaw_api', url);
  document.getElementById('configCard').style.display = 'none';
  loadProducts();
  showToast('✅ Αποθηκεύτηκε!');
}

// JSONP loader
function loadProducts(){
  if(!API_URL){setDbStatus('error','❌ Εισάγαγε πρώτα το API URL');return;}
  setDbStatus('loading','⏳ Φόρτωση προϊόντων...');
  jsonpGet({action:'getProducts'}, function(data){
    if(data.error){setDbStatus('error','❌ '+data.error);return;}
    products = data.products;
    setDbStatus('ok','✅ '+data.count+' προϊόντα φορτώθηκαν');
    showToast('✅ '+data.count+' προϊόντα!');
  }, function(){
    setDbStatus('error','❌ Σφάλμα σύνδεσης');
  });
}

function jsonpGet(params, onSuccess, onError){
  var cb = 'cb_'+Date.now();
  var script = document.createElement('script');
  var done = false;
  var timeout = setTimeout(function(){
    if(!done){done=true;cleanup();onError&&onError();}
  },10000);
  window[cb] = function(data){
    if(!done){done=true;clearTimeout(timeout);cleanup();onSuccess(data);}
  };
  params.callback = cb;
  var qs = Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  script.src = API_URL+'?'+qs;
  script.onerror = function(){if(!done){done=true;clearTimeout(timeout);cleanup();onError&&onError();}};
  document.body.appendChild(script);
  function cleanup(){document.body.removeChild(script);delete window[cb];}
}

function setDbStatus(t,m){var e=document.getElementById('dbStatus');e.className='db-status '+t;e.textContent=m;}

// SCANNER
function toggleScan(){scanning?stopScan():startScan();}
function startScan(){
  document.getElementById('scanBtn').className='scan-btn stop';
  document.getElementById('scanBtn').textContent='⏹ Σταματήσε Κάμερα';
  scanning=true;
  scanner=new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(function(cams){
    if(!cams.length){showToast('❌ Δεν βρέθηκε κάμερα');stopScan();return;}
    // Προτεραιότητα στην πίσω κάμερα
    var cam = cams.find(function(c){return c.label.toLowerCase().includes('back')||c.label.toLowerCase().includes('rear');}) || cams[cams.length-1];
    scanner.start(cam.id,{fps:10,qrbox:{width:250,height:150}},
      function(code){onScan(code);stopScan();},function(){})
    .catch(function(err){showToast('❌ '+err);stopScan();});
  }).catch(function(){showToast('❌ Χωρίς άδεια κάμερας');stopScan();});
}
function stopScan(){
  if(scanner){scanner.stop().catch(function(){});scanner=null;}
  document.getElementById('scanBtn').className='scan-btn start';
  document.getElementById('scanBtn').textContent='📷 Ενεργοποίηση Κάμερας';
  scanning=false;
}
function onScan(code){
  showToast('📷 '+code);
  document.getElementById('manualCode').value=code;
  lookupCode();
}

// LOOKUP
function lookupCode(){
  var raw=document.getElementById('manualCode').value.trim();
  if(!raw)return;
  var prod=products[raw]||products[raw.toLowerCase()]||products[raw.replace(/^0+/,'')]||null;
  if(!prod){var n=parseInt(raw,10);if(!isNaN(n))prod=products[String(n)]||null;}
  var box=document.getElementById('resultBox'),sec=document.getElementById('addSection');
  if(prod){
    currentProduct=Object.assign({},prod,{scannedCode:raw});
    qty=1;document.getElementById('qtyVal').textContent='1';document.getElementById('discInput').value='0';
    box.className='result-box found';
    box.innerHTML='<div class="result-label">✅ Βρέθηκε</div>'+
      '<div class="result-name">'+prod.name+'</div>'+
      '<div class="result-price">'+(prod.price?prod.price.toFixed(2)+' €':'—')+'</div>'+
      (prod.code?'<span class="badge">📦 '+prod.code+'</span>':'')+
      '<span class="badge">🏭 '+(prod.supplier||'—')+'</span>';
    sec.style.display=prod.price?'block':'none';
  } else {
    currentProduct=null;
    box.className='result-box notfound';
    box.innerHTML='<div class="result-label">❌ Δεν βρέθηκε</div>'+
      '<div class="result-name">'+raw+'</div>';
    sec.style.display='none';
  }
}

function changeQty(d){qty=Math.max(1,qty+d);document.getElementById('qtyVal').textContent=qty;}

function addToCart(){
  if(!currentProduct||!currentProduct.price)return;
  var disc=parseFloat(document.getElementById('discInput').value)/100||0;
  var fp=currentProduct.price*qty*(1-disc);
  var profit=currentProduct.cost?(currentProduct.price-currentProduct.cost)*qty*(1-disc):null;
  cart.push({code:currentProduct.scannedCode,name:currentProduct.name,
    unitPrice:currentProduct.price,cost:currentProduct.cost,
    qty:qty,disc:disc,finalPrice:fp,profit:profit,
    time:new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'}),
    date:new Date().toLocaleDateString('el-GR')});
  renderCart();
  showToast('✅ Προστέθηκε!');
  document.getElementById('manualCode').value='';
  document.getElementById('resultBox').className='result-box empty';
  document.getElementById('resultBox').innerHTML='<div class="result-label">Αποτέλεσμα</div><div class="result-name" style="color:var(--muted)">Σκάναρε ή πληκτρολόγησε κωδικό...</div>';
  document.getElementById('addSection').style.display='none';
  currentProduct=null;qty=1;
}

function renderCart(){
  var body=document.getElementById('cartBody'),empty=document.getElementById('cartEmpty'),table=document.getElementById('cartTable');
  if(!cart.length){empty.style.display='block';table.style.display='none';updateTotals();return;}
  empty.style.display='none';table.style.display='block';
  body.innerHTML=cart.map(function(item,i){
    return '<tr><td style="max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+item.name+'</td>'+
      '<td style="text-align:center">'+item.qty+'</td>'+
      '<td style="text-align:right;font-weight:700;color:var(--green)">'+item.finalPrice.toFixed(2)+'€</td>'+
      '<td><button class="del-btn" onclick="removeItem('+i+')">🗑</button></td></tr>';
  }).join('');
  updateTotals();
}

function removeItem(i){cart.splice(i,1);renderCart();}

function updateTotals(){
  var rev=cart.reduce(function(s,i){return s+i.finalPrice;},0);
  var profit=cart.reduce(function(s,i){return s+(i.profit||0);},0);
  document.getElementById('totItems').textContent=cart.length;
  document.getElementById('totRevenue').textContent=rev.toFixed(2)+'€';
  document.getElementById('totProfit').textContent=profit.toFixed(2)+'€';
}

function syncToSheets(){
  if(!cart.length){showToast('❌ Άδειο καλάθι');return;}
  if(!API_URL){showToast('❌ Δεν έχει οριστεί API URL');return;}
  document.getElementById('syncStatus').innerHTML='<span class="sync-dot"></span> Αποθήκευση...';
  var pending=cart.length,success=0,failed=0;
  cart.forEach(function(item){
    jsonpGet({
      action:'addSale',
      code:item.code, name:item.name,
      unitPrice:item.unitPrice, qty:item.qty,
      disc:(item.disc*100).toFixed(0),
      finalPrice:item.finalPrice.toFixed(2), note:''
    }, function(r){
      if(r&&r.success)success++;else failed++;
      pending--;if(pending===0)finishSync();
    }, function(){
      failed++;pending--;if(pending===0)finishSync();
    });
  });
  function finishSync(){
    if(failed===0){
      document.getElementById('syncStatus').innerHTML='✅ '+success+' πωλήσεις αποθηκεύτηκαν!';
      showToast('☁️ Αποθηκεύτηκαν!');
      cart=[];renderCart();
    } else {
      document.getElementById('syncStatus').innerHTML='⚠️ '+success+' επιτυχείς, '+failed+' αποτυχίες';
    }
  }
}

function printReceipt(){
  if(!cart.length){showToast('❌ Άδειο καλάθι');return;}
  var total=cart.reduce(function(s,i){return s+i.finalPrice;},0);
  var lines=cart.map(function(i){return i.name.substring(0,35)+'\n  '+i.qty+' x '+i.unitPrice.toFixed(2)+'€ = '+i.finalPrice.toFixed(2)+'€';}).join('\n');
  var w=window.open('','','width=400,height=600');
  w.document.write('<pre style="font-family:monospace;font-size:13px;padding:20px">🐾 THE PAW PET SHOP\n============================\n'+
    new Date().toLocaleString('el-GR')+'\n============================\n'+lines+
    '\n============================\nΣΥΝΟΛΟ: '+total.toFixed(2)+' €\n============================\nΕυχαριστούμε!\n</pre>');
  w.print();
}

function clearCart(){
  if(!cart.length)return;
  if(!confirm('Να διαγραφεί το καλάθι;'))return;
  cart=[];renderCart();showToast('🗑️ Καθαρίστηκε');
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
</script>
</body>
</html>
